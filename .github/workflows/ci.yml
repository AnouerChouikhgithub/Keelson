name: CI

# Every check the repository documents, on every push and pull request.
#
# No secrets are involved: the mail transport is a local Mailpit or a null
# transport, and every credential below is a CI-only literal. Actions are pinned
# to full commit SHAs with the version in a comment, so a tag cannot move under
# the build; Dependabot keeps those pins current (see .github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'
  PNPM_VERSION: '12.14.0'

jobs:
  # A path that .gitignore matches and that is committed anyway is invisible to
  # `git status` and easy to keep updating by accident (audit screenshots, a
  # working report, a machine-local env file). The tree must stay in agreement with
  # its own ignore rules; the one intentional exception is `backend/.env`, which is
  # un-ignored explicitly in .gitignore.
  hygiene:
    name: Repository hygiene (no tracked-but-ignored paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fail when a git-ignored path is tracked
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked" ]; then
            echo '::error::These paths are tracked although .gitignore matches them:'
            printf '%s\n' "$tracked" | sed 's/^/  /'
            echo 'Either untrack them (git rm --cached) or un-ignore them explicitly.'
            exit 1
          fi
          echo 'No tracked-but-ignored paths.'

  frontend:
    name: Frontend (types, lint, tests, build, bundle budget)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm run lint
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Bundle budget
        run: pnpm run check:bundle

  backend:
    name: Backend (static analysis, style, tests, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keelson_owner
          POSTGRES_PASSWORD: keelson_owner
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelson_owner -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_SECRET: ci-only-not-a-secret
      MAILER_DSN: 'null://null'
      FRONTEND_URL: http://localhost:5173
      REQUIRE_VERIFIED_EMAIL: 'true'
      # The application role owns nothing: migrations run as the owner role and
      # the suite runs as the app role, which is the privilege split production
      # uses. The test environment appends `_test` to the database name.
      DATABASE_OWNER_URL: postgresql://keelson_owner:keelson_owner@127.0.0.1:5432/keelson?serverVersion=16&charset=utf8
      DATABASE_URL: postgresql://keelson_app:keelson_app@127.0.0.1:5432/keelson?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.35.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, sodium, intl, ctype, iconv
          # pcov, not xdebug: coverage without the debugger's overhead.
          coverage: pcov
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.3
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Check platform requirements
        run: composer check-platform-reqs
      - name: Lint YAML, container and routes
        run: |
          php bin/console lint:yaml config --env=test
          php bin/console lint:container --env=test
          php bin/console debug:router --env=test
      # The dead-code detector reads the compiled container to know which
      # services and controllers are entry points. It loads every path listed in
      # phpstan.neon.dist and fails when one is missing, so both kernels are
      # warmed here: the test one for this job and the dev one a developer shell
      # usually has, which the configuration also lists.
      - name: Warm the compiled containers for static analysis
        run: |
          php bin/console cache:warmup --env=test
          php bin/console cache:warmup --env=dev
      - name: Doctrine mapping validation
        run: php bin/console doctrine:schema:validate --skip-sync --env=test
      - name: PHPStan (level 8, no baseline)
        run: composer stan
      - name: php-cs-fixer (dry run)
        run: composer cs
      - name: Create the application role and the test database
        env:
          PGPASSWORD: keelson_owner
        run: |
          psql -h 127.0.0.1 -U keelson_owner -d keelson -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE keelson_app LOGIN PASSWORD 'keelson_app';
          CREATE DATABASE keelson_test OWNER keelson_owner;
          SQL
          psql -h 127.0.0.1 -U keelson_owner -d keelson_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE keelson_test TO keelson_app;
          GRANT USAGE, CREATE ON SCHEMA public TO keelson_app;
          SQL
      - name: Migrate the test database as the owner role
        run: DATABASE_URL="$DATABASE_OWNER_URL" php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Migration consistency (nothing pending)
        run: DATABASE_URL="$DATABASE_OWNER_URL" php bin/console doctrine:migrations:up-to-date --env=test
      - name: Grant the application role access to the migrated schema
        env:
          PGPASSWORD: keelson_owner
        run: |
          psql -h 127.0.0.1 -U keelson_owner -d keelson_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO keelson_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO keelson_app;
          SQL
      # The integration suite installs triggers and exercises schema-level
      # behaviour (a failing audit insert must roll the customer back), which the
      # application role deliberately cannot do. Tests run as the owner role; the
      # application role's narrower privileges are what production uses.
      - name: PHPUnit with coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_OWNER_URL }}
        run: php bin/phpunit --coverage-clover var/coverage/clover.xml --coverage-filter src
      - name: Coverage gate (80% for Service, Security and Controller)
        run: php bin/coverage-check.php var/coverage/clover.xml --threshold=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/var/coverage/clover.xml
          if-no-files-found: ignore

  e2e:
    name: End-to-end journeys (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The fixture loader refuses a database whose name does not look local
          # (it must contain test/dev/fixture). `keelson` is the production name,
          # so the e2e stack uses an explicitly test-named database instead of
          # bypassing the guard.
          POSTGRES_USER: keelson
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelson -d keelson_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: dev
      APP_SECRET: ci-only-not-a-secret
      DATABASE_URL: postgresql://keelson:keelson@127.0.0.1:5432/keelson_e2e_test?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://127.0.0.1:1025
      FRONTEND_URL: http://localhost:5173
      REQUIRE_VERIFIED_EMAIL: 'true'
      E2E_BASE_URL: http://localhost:5173
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.35.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, sodium, intl, ctype, iconv
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      # `backend/.env` names the local Compose database (port 5433); CI's
      # PostgreSQL is a service on 5432. .env.local is the documented
      # per-environment override and is git-ignored. It is written here rather
      # than relying on the job environment because the API server Playwright
      # starts read `.env` instead (the journeys then failed against a database
      # that does not exist in CI).
      - name: Prepare the database
        working-directory: backend
        run: |
          cat > .env.local <<'DOTENV'
          APP_ENV=dev
          APP_SECRET=ci-only-not-a-secret
          DATABASE_URL="postgresql://keelson:keelson@127.0.0.1:5432/keelson_e2e_test?serverVersion=16&charset=utf8"
          MAILER_DSN="smtp://127.0.0.1:1025"
          FRONTEND_URL="http://localhost:5173"
          DEFAULT_URI="http://localhost:5173"
          REQUIRE_VERIFIED_EMAIL=true
          # The AI journey must actually run, not skip: this is the only place the
          # assistant and the summary are exercised end to end. `fake` is the
          # deterministic provider, so no credential is involved.
          AI_ENABLED=true
          AI_PROVIDER=fake
          DOTENV
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:fixtures:load --force
      # Playwright starts its own API and SPA, and refuses to reuse a port that
      # already answers (reuseExistingServer is off in CI). This probe proves the
      # application boots with the job's environment, then stops the server it
      # started so the journeys can bind the port themselves.
      - name: Verify the API boots before the browser does
        run: |
          php -S 127.0.0.1:8000 -t backend/public backend/public/index.php > /tmp/api.log 2>&1 &
          api=$!
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then healthy=1; break; fi
            sleep 1
          done
          kill "$api" 2>/dev/null || true
          wait "$api" 2>/dev/null || true
          if [ "$healthy" -ne 1 ]; then
            echo 'The API did not become healthy:' >&2
            cat /tmp/api.log >&2
            exit 1
          fi
      - name: Run the journeys
        working-directory: e2e
        run: pnpm test
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.35.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: Composer audit (lock file only, no install)
        id: composer-audit
        working-directory: backend
        # `--locked` audits composer.lock without vendor/, which is what an
        # audit job has: it previously ran `composer audit` against a checkout
        # with no installed packages. Blocking: a new advisory must be triaged
        # (upgrade, or a documented exception) before merging.
        continue-on-error: true
        run: composer audit --locked --format=plain
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (frontend)
        id: pnpm-frontend
        if: always()
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit --audit-level high
      - name: pnpm audit (e2e)
        id: pnpm-e2e
        if: always()
        working-directory: e2e
        continue-on-error: true
        run: pnpm audit --audit-level high
      # The individual steps are non-blocking so that a PHP advisory cannot hide
      # a JavaScript one; this step restores the blocking behaviour for the job.
      - name: Fail when any audit reported a problem
        if: always()
        run: |
          failed=0
          for check in composer-audit pnpm-frontend pnpm-e2e; do
            case "$check" in
              composer-audit) outcome='${{ steps.composer-audit.outcome }}' ;;
              pnpm-frontend) outcome='${{ steps.pnpm-frontend.outcome }}' ;;
              pnpm-e2e) outcome='${{ steps.pnpm-e2e.outcome }}' ;;
            esac
            if [ "$outcome" != "success" ]; then
              echo "::error::$check reported a problem (outcome: $outcome)"
              failed=1
            fi
          done
          exit "$failed"
