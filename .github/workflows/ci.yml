name: CI

# Every check the repository documents, on every push and pull request.
#
# No secrets are involved: the mail transport is a local Mailpit or a null
# transport, and every credential below is a CI-only literal. Actions are pinned
# to full commit SHAs with the version in a comment, so a tag cannot move under
# the build; Dependabot keeps those pins current (see .github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'
  PNPM_VERSION: '12.14.0'

jobs:
  frontend:
    name: Frontend (types, lint, tests, build, bundle budget)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm run lint
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Bundle budget
        run: pnpm run check:bundle

  backend:
    name: Backend (static analysis, style, tests, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keelson_owner
          POSTGRES_PASSWORD: keelson_owner
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelson_owner -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_SECRET: ci-only-not-a-secret
      MAILER_DSN: 'null://null'
      FRONTEND_URL: http://localhost:5173
      REQUIRE_VERIFIED_EMAIL: 'true'
      # The application role owns nothing: migrations run as the owner role and
      # the suite runs as the app role, which is the privilege split production
      # uses. The test environment appends `_test` to the database name.
      DATABASE_OWNER_URL: postgresql://keelson_owner:keelson_owner@127.0.0.1:5432/keelson?serverVersion=16&charset=utf8
      DATABASE_URL: postgresql://keelson_app:keelson_app@127.0.0.1:5432/keelson?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.35.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, sodium, intl, ctype, iconv
          # pcov, not xdebug: coverage without the debugger's overhead.
          coverage: pcov
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Check platform requirements
        run: composer check-platform-reqs
      - name: Lint YAML, container and routes
        run: |
          php bin/console lint:yaml config --env=test
          php bin/console lint:container --env=test
          php bin/console debug:router --env=test
      # The dead-code detector reads the compiled container to know which
      # services and controllers are entry points. CI runs with APP_ENV=test, so
      # the dev container it used to expect never exists here; warm the test one
      # and let phpstan.neon.dist list both paths.
      - name: Warm the compiled container for static analysis
        run: php bin/console cache:warmup --env=test --no-debug=false
      - name: Doctrine mapping validation
        run: php bin/console doctrine:schema:validate --skip-sync --env=test
      - name: PHPStan (level 8, no baseline)
        run: composer stan
      - name: php-cs-fixer (dry run)
        run: composer cs
      - name: Create the application role and the test database
        env:
          PGPASSWORD: keelson_owner
        run: |
          psql -h 127.0.0.1 -U keelson_owner -d keelson -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE keelson_app LOGIN PASSWORD 'keelson_app';
          CREATE DATABASE keelson_test OWNER keelson_owner;
          SQL
          psql -h 127.0.0.1 -U keelson_owner -d keelson_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE keelson_test TO keelson_app;
          GRANT USAGE, CREATE ON SCHEMA public TO keelson_app;
          SQL
      - name: Migrate the test database as the owner role
        run: DATABASE_URL="$DATABASE_OWNER_URL" php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Migration consistency (nothing pending)
        run: DATABASE_URL="$DATABASE_OWNER_URL" php bin/console doctrine:migrations:up-to-date --env=test
      - name: Grant the application role access to the migrated schema
        env:
          PGPASSWORD: keelson_owner
        run: |
          psql -h 127.0.0.1 -U keelson_owner -d keelson_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO keelson_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO keelson_app;
          SQL
      - name: PHPUnit with coverage
        run: php bin/phpunit --coverage-clover var/coverage/clover.xml --coverage-filter src
      - name: Coverage gate (80% for Service, Security and Controller)
        run: php bin/coverage-check.php var/coverage/clover.xml --threshold=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/var/coverage/clover.xml
          if-no-files-found: ignore

  e2e:
    name: End-to-end journeys (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The fixture loader refuses a database whose name does not look local
          # (it must contain test/dev/fixture). `keelson` is the production name,
          # so the e2e stack uses an explicitly test-named database instead of
          # bypassing the guard.
          POSTGRES_USER: keelson
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelson -d keelson_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: dev
      APP_SECRET: ci-only-not-a-secret
      DATABASE_URL: postgresql://keelson:keelson@127.0.0.1:5432/keelson_e2e_test?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://127.0.0.1:1025
      FRONTEND_URL: http://localhost:5173
      REQUIRE_VERIFIED_EMAIL: 'true'
      E2E_BASE_URL: http://localhost:5173
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.35.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, sodium, intl, ctype, iconv
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare the database
        working-directory: backend
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:fixtures:load --force
      - name: Verify the API boots before the browser does
        run: |
          php -S 127.0.0.1:8000 -t backend/public backend/public/index.php > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'The API did not become healthy:' >&2
          cat /tmp/api.log >&2
          exit 1
      - name: Run the journeys
        working-directory: e2e
        run: pnpm test
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.35.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: Composer audit (lock file only, no install)
        id: composer-audit
        working-directory: backend
        # `--locked` audits composer.lock without vendor/, which is what an
        # audit job has: it previously ran `composer audit` against a checkout
        # with no installed packages. Blocking: a new advisory must be triaged
        # (upgrade, or a documented exception) before merging.
        continue-on-error: true
        run: composer audit --locked --format=plain
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (frontend)
        id: pnpm-frontend
        if: always()
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit --audit-level high
      - name: pnpm audit (e2e)
        id: pnpm-e2e
        if: always()
        working-directory: e2e
        continue-on-error: true
        run: pnpm audit --audit-level high
      # The individual steps are non-blocking so that a PHP advisory cannot hide
      # a JavaScript one; this step restores the blocking behaviour for the job.
      - name: Fail when any audit reported a problem
        if: always()
        run: |
          failed=0
          for check in composer-audit pnpm-frontend pnpm-e2e; do
            case "$check" in
              composer-audit) outcome='${{ steps.composer-audit.outcome }}' ;;
              pnpm-frontend) outcome='${{ steps.pnpm-frontend.outcome }}' ;;
              pnpm-e2e) outcome='${{ steps.pnpm-e2e.outcome }}' ;;
            esac
            if [ "$outcome" != "success" ]; then
              echo "::error::$check reported a problem (outcome: $outcome)"
              failed=1
            fi
          done
          exit "$failed"
