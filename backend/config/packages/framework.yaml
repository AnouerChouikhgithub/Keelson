# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Deployment-facing values, unset locally. TRUSTED_HOSTS is required in prod
    # (see App\Config\EnvironmentValidator); comma-separated entries and regex
    # patterns are accepted. Trusted proxies are opt-in: setting one without
    # TRUSTED_HEADERS would silently ignore X-Forwarded-Proto, so the validator
    # requires both together.
    trusted_hosts: '%env(default::TRUSTED_HOSTS)%'
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: '%env(default::TRUSTED_HEADERS)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # Server-side sessions in PostgreSQL: they survive a deploy and are shared
        # by every worker. `cookie_secure: auto` upgrades to Secure whenever the
        # request is HTTPS (including a trusted proxy's X-Forwarded-Proto), so a
        # local HTTP sign-in still works while production never sends the cookie
        # in clear.
        handler_id: 'session.handler.pdo'
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        cookie_lifetime: 0
        gc_maxlifetime: 3600
        gc_probability: 1
        gc_divisor: 100

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
