security:
    providers:
        oidc_principals:
            id: App\Security\OidcPrincipalProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Liveness must answer before OIDC is configured: the main firewall
        # builds the OIDC authenticator per request and would fail with a
        # missing-client error instead of returning a probe response.
        healthz:
            pattern: ^/healthz$
            security: false
            stateless: true
        main:
            lazy: true
            provider: oidc_principals
            pattern: ^/(?!login$)
            oidc:
                check_path: /login_check
                login_path: app_login
                user_identifier_property: sub
                user_identifier_from_idtoken: true
                # The provider redirect is implemented by
                # App\EventListener\OidcEndSessionLogoutListener so that a
                # provider failure degrades to the local logout instead of
                # failing the request after the session was invalidated.
                enable_end_session_listener: false
            logout:
                path: /logout
                target: /
                enable_csrf: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # The browser shell must learn it is signed out without being bounced
        # through OIDC; the controller exposes only the caller's own identity.
        - { path: ^/api/session$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: ROLE_USER }
        - { path: ^/healthz$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
