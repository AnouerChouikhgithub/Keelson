security:
    password_hashers:
        App\Entity\Principal:
            algorithm: auto

    providers:
        # The account is its email address; the provider looks it up verbatim,
        # so Principal normalizes the address before it is stored.
        app_principals:
            entity:
                class: App\Entity\Principal
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_principals
            # An unauthenticated API call is answered with 401 JSON. There is no
            # server-rendered sign-in page to redirect to.
            entry_point: App\Security\ApiAuthenticationEntryPoint
            user_checker: App\Security\VerifiedUserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonLoginSuccessHandler
                failure_handler: App\Security\JsonLoginFailureHandler
            # Five attempts per address per minute. The framework's throttle is
            # declared for completeness, but its listener is not invoked in this
            # setup, so App\EventListener\LoginThrottleListener enforces the same
            # policy in front of the firewall (config/packages/rate_limiter.yaml).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        # Sign-in, registration and the token flows are reachable without a
        # session. Everything else requires one.
        - { path: ^/api/auth/(register|verify-email|login|forgot-password|reset-password)$, roles: PUBLIC_ACCESS }
        # The shell must learn it is signed out without a 401 of its own probe.
        - { path: ^/api/session$, roles: PUBLIC_ACCESS }
        - { path: ^/healthz$, roles: PUBLIC_ACCESS }
        - { path: ^/readyz$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        # Tests hash and verify hundreds of passwords; the production cost is
        # deliberately unaffordable there.
        password_hashers:
            App\Entity\Principal:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
