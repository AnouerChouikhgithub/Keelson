security:
    password_hashers:
        App\Entity\Principal:
            algorithm: auto

    providers:
        # The account is its email address; the provider looks it up verbatim,
        # so Principal normalizes the address before it is stored.
        app_principals:
            entity:
                class: App\Entity\Principal
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_principals
            # An unauthenticated API call is answered with 401 JSON. There is no
            # server-rendered sign-in page to redirect to.
            entry_point: App\Security\ApiAuthenticationEntryPoint
            user_checker: App\Security\VerifiedUserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonLoginSuccessHandler
                failure_handler: App\Security\JsonLoginFailureHandler
            # No `login_throttling` here on purpose. App\EventListener\AuthThrottleListener
            # answers the sixth attempt with 429 + Retry-After *before* the password is
            # checked, using the three buckets in config/packages/rate_limiter.yaml, and
            # it also covers resend-verification. Declaring the framework's own throttle
            # as well would be a second, invisible policy: it counts a different key, it
            # cannot refuse before the hash comparison, and its 429 is a plain login
            # failure rather than this API's error body.
            # tests/Unit/Config/SecurityThrottleConfigTest.php keeps this absent.

    access_control:
        # Sign-in, registration and the token flows are reachable without a
        # session. Everything else requires one.
        - { path: ^/api/auth/(register|verify-email|login|forgot-password|reset-password|resend-verification|accept-invitation)$, roles: PUBLIC_ACCESS }
        # The invitation link is opened by someone who has no account yet: the
        # preview must work without a session, and the response reveals only what
        # the recipient was already sent.
        - { path: ^/api/invitations/[^/]+$, roles: PUBLIC_ACCESS, methods: GET }
        # The shell must learn it is signed out without a 401 of its own probe.
        - { path: ^/api/session$, roles: PUBLIC_ACCESS }
        - { path: ^/healthz$, roles: PUBLIC_ACCESS }
        - { path: ^/readyz$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        # Tests hash and verify hundreds of passwords; the production cost is
        # deliberately unaffordable there.
        password_hashers:
            App\Entity\Principal:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
