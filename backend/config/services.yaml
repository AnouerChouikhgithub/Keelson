# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:
    # Structured log threshold; LOG_LEVEL overrides it for an investigation.
    app.log.minimum_level: 'warning'

    # Where the SPA lives. Verification and reset emails link here, because the
    # token is redeemed by the client, not by an API GET.
    app.frontend_url: '%env(FRONTEND_URL)%'
    app.mail.from: 'no-reply@keelson.local'

    # Off only where accounts must work before mail delivery exists. On, an
    # unverified account cannot sign in.
    app.auth.require_verified_email: '%env(bool:REQUIRE_VERIFIED_EMAIL)%'

    # AI foundation. `AI_ENABLED` is the deployment switch every AI call consults;
    # `AI_PROVIDER=fake` keeps a checkout working without a credential. The empty
    # fallbacks keep the container bootable when no AI variables are configured.
    app.ai.enabled: '%env(bool:AI_ENABLED)%'
    app.ai.provider: '%env(default:app.ai.provider.fallback:AI_PROVIDER)%'
    app.ai.provider.fallback: 'fake'
    app.ai.empty: ''

    # The shared password every synthetic demo account is seeded with. It is a
    # documented, dev-only value: production cannot reach the loader (the target
    # guard refuses it) and the plaintext is never stored or printed as a hash.
    app.fixture.password.fallback: !php/const App\DataFixtures\SyntheticFixtureCatalog::FALLBACK_PASSWORD

    # Inputs for App\Config\EnvironmentValidator. Only presence and shape are
    # checked, and only names are reported, so reading this map never exposes a
    # value. `default::` keeps the container bootable when a variable is absent;
    # the validator decides whether that absence is fatal in this environment.
    app.environment_requirements:
        APP_SECRET: '%env(default::APP_SECRET)%'
        DATABASE_URL: '%env(default::DATABASE_URL)%'
        DEFAULT_URI: '%env(default::DEFAULT_URI)%'
        FRONTEND_URL: '%env(default::FRONTEND_URL)%'
        MAILER_DSN: '%env(default::MAILER_DSN)%'
        TRUSTED_HOSTS: '%env(default::TRUSTED_HOSTS)%'
        TRUSTED_PROXIES: '%env(default::TRUSTED_PROXIES)%'
        TRUSTED_HEADERS: '%env(default::TRUSTED_HEADERS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\MailFactory:
        arguments:
            $frontendUrl: '%app.frontend_url%'
            $fromAddress: '%app.mail.from%'

    App\Security\VerifiedUserChecker:
        arguments:
            $requireVerifiedEmail: '%app.auth.require_verified_email%'

    # One JSON log line per event, with the request id and redacted context.
    # It decorates the framework logger so framework and application records
    # share the same stream instead of duplicating each other.
    App\Logging\StructuredLogger:
        decorates: logger
        decoration_inner_name: 'app.logger.inner'
        arguments:
            $fallback: '@app.logger.inner'
            $minimumLevel: '%env(default:app.log.minimum_level:LOG_LEVEL)%'

    App\Config\EnvironmentValidator: ~

    # Session storage on the application connection (see App\Session\PdoSessionHandlerFactory).
    App\Session\PdoSessionHandlerFactory:
        arguments:
            $environment: '%kernel.environment%'

    session.handler.pdo:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        factory: ['@App\Session\PdoSessionHandlerFactory', 'create']

    # HSTS depends on the environment, which autowiring cannot resolve.
    App\EventListener\SecurityHeadersListener:
        arguments:
            $environment: '%kernel.environment%'

    App\Config\ConfigurationCheckWarmer:
        arguments:
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'
            $configuration: '%app.environment_requirements%'

    App\Command\CheckConfigurationCommand:
        arguments:
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'
            $configuration: '%app.environment_requirements%'

    App\Security\PrincipalVoter:
        tags: ['security.voter']

    App\Security\InvoiceVoter:
        tags: ['security.voter']

    App\Security\OrganizationVoter:
        tags: ['security.voter']

    # AI foundation: the deployment switch is a parameter, and the provider is chosen
    # from AI_PROVIDER at runtime (see App\Ai\AiProviderSelector).
    App\Ai\AiFeatureFlags:
        arguments:
            $enabled: '%app.ai.enabled%'

    App\Ai\AiProviderSelector:
        arguments:
            $provider: '%app.ai.provider%'

    App\Ai\HttpAiProvider:
        arguments:
            $apiKey: '%env(default:app.ai.empty:AI_API_KEY)%'
            $model: '%env(default:app.ai.empty:AI_MODEL)%'
            $baseUrl: '%env(default:app.ai.empty:AI_BASE_URL)%'

    # Synthetic dev/test fixtures. The target guard reads the effective DBAL
    # connection parameters (including Doctrine's test dbname suffix), so only
    # the environment is injected here.
    App\DataFixtures\SyntheticFixtureLoader:
        arguments:
            $environment: '%kernel.environment%'
            $password: '%env(default:app.fixture.password.fallback:FIXTURE_PASSWORD)%'

    # The command prints the demo password column from the loader's result and
    # only when the environment is not production.
    App\Command\LoadSyntheticFixturesCommand:
        arguments:
            $environment: '%kernel.environment%'

    # Bulk performance data is guarded by the same target check as the loader,
    # which also needs the environment to refuse production.
    App\Command\BulkFixturesCommand:
        arguments:
            $environment: '%kernel.environment%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        # Nothing in the application wires the gateway yet (its first feature is a
        # later track), so the test container would inline it away. These aliases
        # keep the foundation testable without making production services public.
        App\Ai\AiGateway:
            public: true
        App\Ai\AiFeatureFlags:
            public: true
            arguments:
                $enabled: '%app.ai.enabled%'
        App\Ai\FakeAiProvider:
            public: true
        App\Repository\OrganizationAiSettingsRepository:
            public: true
