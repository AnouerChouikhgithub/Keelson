; php-fpm pool for the API container.
;
; The process runs as www-data (the image's USER), listens on every interface so
; the frontend container can reach it, and logs to the container's stderr so
; `docker logs` shows what happened.

[www]
listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2
access.format = "%m %{REQUEST_URI}e %s %{milli}d ms"

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
