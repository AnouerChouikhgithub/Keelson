; Production PHP settings for the API image.
;
; The image sets APP_ENV=prod, so the opcache is the difference between a request
; that parses the framework and one that does not. Timestamps are not validated
; because the code only changes when a new image is deployed.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=disabled

expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
max_execution_time=30

; Uploads are not part of the API, so the limits are small on purpose.
upload_max_filesize=2M
post_max_size=8M

realpath_cache_size=4096K
realpath_cache_ttl=600

date.timezone=UTC
