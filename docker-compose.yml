# Local development services only. Symfony and the frontend run on the host,
# not in Docker. The explicit project name keeps containers, networks and the
# volume clearly namespaced as `keelson`.
#
# The credentials below are development placeholders and are also the defaults
# in backend/.env.example. Production must supply its own values externally.
#
# Two roles, as in production: POSTGRES_USER owns the schema and runs migrations,
# and the init script creates the least-privilege role the API serves as. Without
# that split the dev server is a superuser, PostgreSQL skips row-level security for
# it, and /readyz answers 503 `rowLevelSecurity: bypass` — the failure this split
# exists to prevent.
#
# Ports are published on 127.0.0.1 only: a development database with a known
# password must not be reachable from the network. Override a port with the
# matching *_PORT variable in the shell or a root .env file.
name: keelson
services:
# The development database is `keelson_dev`, never `keelson`: production uses the
# bare name, and the fixture loader's guard refuses anything that is not obviously
# local. POSTGRES_DB only applies to a *fresh* volume — an existing db_data volume
# keeps its old database name. Create the new one there once with:
#   cd backend && php bin/console doctrine:database:create
# (`backend/bin/dev-reset.sh` does that as part of its drop/create/migrate/seed.)
  db:
    image: postgres:16-alpine
    environment:
      # The owner: it creates the database, owns the tables and runs migrations.
      POSTGRES_USER: ${POSTGRES_USER:-keelson_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keelson_owner}
      POSTGRES_DB: ${POSTGRES_DB:-keelson_dev}
      # The runtime role, created by the init script below with row privileges
      # only. It must not own the tables and must not hold BYPASSRLS.
      APP_DB_USER: ${APP_DB_USER:-keelson_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-keelson_app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory. An existing volume keeps the role
      # it was created with — see README.md, "Roles and the local volume".
      - ./docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 3s
      retries: 5
    # No mailer is configured; this is a convenience UI for later work.
    restart: unless-stopped

volumes:
  # Persistent on purpose: `docker compose down` keeps it, `down -v` destroys it.
  # Never use `down -v` against a database you need, and never point tests here.
  db_data:
