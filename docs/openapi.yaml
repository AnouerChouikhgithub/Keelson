              schema:
                type: object
                required: [steps, completed, total]
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      required: [id, done]
                      properties:
                        id:
                          type: string
                          enum: [invite_team, add_customer, create_invoice, send_invoice, record_payment]
                        done:
                          type: boolean
                  completed:
                    type: integer
                  total:
                    type: integer
