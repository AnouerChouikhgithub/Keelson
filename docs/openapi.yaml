  /api/ai/status:
    get:
      tags: [AI]
      summary: The caller's AI eligibility.
      description: |
        Reads counters only; no provider is called. `organizationId` is optional and
        without it the caller's first active organization is used.
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Eligibility and the remaining monthly token budget.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, organizationEnabled, budgetRemainingTokens]
                properties:
                  enabled:
                    type: boolean
                  organizationEnabled:
                    type: boolean
                  budgetRemainingTokens:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ai/guide:
    post:
      tags: [AI]
      summary: Ask the product assistant, grounded in the bundled documentation.
      description: |
        Retrieval scores the documentation for the requested locale and keeps the top three
        articles the caller's role may see; only those articles, the role and the question are
        sent to the model. A question the documentation does not cover is answered with a fixed
        message in the caller's locale and `sources` is empty: no model call, no spend.

        The assistant never reads tenant rows. `organizationId` is optional and selects the
        tenant whose settings, budget and rate limits apply; without it the caller's oldest
        active organization is used.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 3
                  maxLength: 500
                locale:
                  type: string
                  enum: [en, fr, ar]
                  default: en
                organizationId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Plain-text answer and up to three documentation sources.
          content:
            application/json:
              schema:
                type: object
                required: [answer, sources]
                properties:
                  answer:
                    type: string
                  sources:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [id, title]
                      properties:
                        id:
                          type: string
                        title:
                          type: string
        '400':
          description: The organization id is not a UUID (`invalid_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: The organization has used its monthly token budget (`ai_budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF rejected, or AI is disabled (`ai_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The provider failed (`ai_unavailable`); the reservation is released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/organizations/{organizationId}/ai-settings:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [AI]
      summary: Read the tenant's AI opt-in and budget (Owner or Admin only).
      responses:
        '200':
          description: The effective settings and the remaining budget.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, monthlyTokenBudget, budgetRemainingTokens]
                properties:
                  enabled:
                    type: boolean
                  monthlyTokenBudget:
                    type: integer
                  budgetRemainingTokens:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [AI]
      summary: Replace the tenant's AI opt-in and budget (Owner or Admin only).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, monthlyTokenBudget]
              properties:
                enabled:
                  type: boolean
                monthlyTokenBudget:
                  type: integer
                  minimum: 0
                  maximum: 100000000
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, monthlyTokenBudget, budgetRemainingTokens]
                properties:
                  enabled:
                    type: boolean
                  monthlyTokenBudget:
                    type: integer
                  budgetRemainingTokens:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/organizations/{organizationId}/ai/summaries/{kind}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [overview, receivables, activity]
    post:
      tags: [AI]
      summary: Summarize this organization's own data.
      description: |
        Reads the tenant's aggregates through the caller's active membership, asks the
        provider for 2 to 4 plain sentences and returns the text with the facts behind
        it. Every figure in the text must be derivable from `facts`; otherwise, or when
        the provider is unavailable, the deterministic template is returned and
        `fallback` is `true`. The model never queries the database: it receives only
        counts, amounts in integer millimes, ISO dates, the role, the locale and at
        most five customer display names.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum: [en, fr, ar]
                  description: Overrides `Accept-Language` for this summary.
      responses:
        '200':
          description: Sanitized summary text, the aggregates behind it, and whether the template was used.
          content:
            application/json:
              schema:
                type: object
                required: [text, generatedAt, fallback, facts]
                properties:
                  text:
                    type: string
                  generatedAt:
                    type: string
                    format: date-time
                  fallback:
                    type: boolean
                  facts:
                    type: object
                    additionalProperties: true
        '400':
          description: The organization id is not a UUID (`invalid_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: The monthly token budget cannot fund this call (`ai_budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF rejected, or AI is disabled globally or for this organization (`ai_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe (checks nothing).
      description: Reports only that the application boots; it performs no database call.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: keelson-api
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (single cheap `SELECT 1`).
      description: |
        `503` when PostgreSQL is unusable. The driver message is never returned or logged, so the
        probe is safe to expose to a load balancer.
      security: []
      responses:
        '200':
          description: The process and its database are usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: |
        Symfony's server-side session, stored in PostgreSQL and sent as an HttpOnly, SameSite=Lax
        cookie. Mutating requests additionally need the `X-CSRF-Token` header.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` from `GET /api/session`, minted for the id `api`.
      schema:
        type: string
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: The tenant selector. It is re-authorized on every request and never grants access.
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor, returned as `nextCursor` by the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      description: Case-insensitive "contains" over the list's searchable columns.
      schema:
        type: string
        maxLength: 120
    InvoiceStatusFilter:
      name: status
      in: query
      description: |
        `all` (default), `draft`, `sent`, `paid` or `overdue`. `sent` excludes overdue invoices;
        `overdue` includes stored `overdue` rows and `sent` rows past their due date.
      schema:
        type: string
        enum: [all, draft, sent, paid, overdue]
        default: all
  responses:
    Unauthenticated:
      description: No session, or the session is no longer valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: Authentication is required.
    CsrfRejected:
      description: The origin or CSRF token was refused; the session is untouched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: csrf_invalid
              message: A valid CSRF token is required for this request.
    NotFound:
      description: |
        Missing record, or a tenant the caller is not an active member of. Deliberately
        indistinguishable, so a foreign tenant cannot be detected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Resource not found.
    ValidationFailed:
      description: At least one input was rejected; `fields` names each one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Validation failed.
              fields:
                email:
                  - This value is not a valid email address.
    InvalidJson:
      description: The body is not a JSON object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_json
              message: The request body must be a JSON object.
    InvalidCursor:
      description: The cursor is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_cursor
              message: The cursor is invalid.
    RateLimited:
      description: Too many attempts; `Retry-After` says how long to wait.
      headers:
        Retry-After:
          description: Seconds until the next attempt may succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            code:
              type: string
              description: Stable machine-readable code; the UI localizes from it.
            message:
              type: string
              description: Safe to display; never contains a stack trace or credentials.
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    RegisterRequest:
      type: object
      required: [email, password, organizationName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 10
          maxLength: 72
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
        displayName:
          type: [string, 'null']
          maxLength: 120
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    VerifyEmailRequest:
      type: object
      required: [token, password]
      description: The token from the verification link and the password the mailbox owner chooses.
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 72
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        csrfToken:
          type: [string, 'null']
          description: Null while anonymous; the token the mutation guard expects.
    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
    Role:
      type: string
      enum: [Owner, Admin, Member, Viewer]
    OrganizationMembership:
      type: object
      required: [id, name, subdomain, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Organization:
      type: object
      required: [id, name, subdomain, status, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        status:
          type: string
          enum: [active, suspended, deleted]
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    CreateOrganizationRequest:
      type: object
      required: [name, subdomain]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        subdomain:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
    Member:
      type: object
      required: [id, principalId, email, role, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    Invitation:
      type: object
      required: [id, email, role, status, expired, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [pending, accepted, revoked]
        expired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitationPreview:
      type: object
      required: [organizationName, role, email, expired, accepted]
      properties:
        organizationName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
        expired:
          type: boolean
        accepted:
          type: boolean
    AcceptInvitationResult:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    BillingAddress:
      type: object
      required: [street, city, postalCode, countryCode]
      additionalProperties: false
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
          minLength: 1
          maxLength: 160
        postalCode:
          type: string
          minLength: 1
          maxLength: 160
        countryCode:
          type: string
          minLength: 1
          maxLength: 160
          description: Upper-cased by the entity.
    CustomerSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerSummary'
        - type: object
          properties:
            billingAddress:
              oneOf:
                - $ref: '#/components/schemas/BillingAddress'
                - type: 'null'
    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
          maxLength: 40
        billingAddress:
          oneOf:
            - $ref: '#/components/schemas/BillingAddress'
            - type: 'null'
    CustomerPatch:
      type: object
      description: Only the mutable subset; unknown keys are rejected rather than ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        billingAddress:
          oneOf:
            - $ref: '#/components/schemas/BillingAddress'
            - type: 'null'
    InvoiceLineItem:
      type: object
      required: [description, quantity, unitPrice, lineTotal]
      properties:
        description:
          type: string
          maxLength: 240
        quantity:
          type: string
          description: Decimal string with at most 3 places.
        unitPrice:
          type: string
          description: Decimal string with at most 3 places.
        lineTotal:
          type: string
          description: Computed by the server.
    Invoice:
      type: object
      required:
        - id
        - number
        - customerId
        - customer
        - status
        - issueDate
        - dueDate
        - currency
        - lineItems
        - subtotal
        - taxAmount
        - total
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Per-tenant, per-year sequence, for example `2026-000001`.
        customerId:
          type: string
          format: uuid
        customer:
          $ref: '#/components/schemas/Customer'
        status:
          type: string
          enum: [draft, sent, paid, overdue]
          description: '`overdue` is derived from `dueDate` on read; no read writes state.'
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        currency:
          type: string
          const: TND
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        taxRate:
          type: [string, 'null']
          description: Up to 4 decimal places.
        discountAmount:
          type: [string, 'null']
          description: 3 decimal places.
        subtotal:
          type: string
        taxAmount:
          type: string
        total:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time
        paidAt:
          type: [string, 'null']
          format: date-time
    InvoiceDraftInput:
      type: object
      required: [customerId, issueDate, dueDate, currency, lineItems]
      properties:
        customerId:
          type: string
          format: uuid
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        currency:
          type: string
          const: TND
        lineItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 240
              quantity:
                type: string
                description: Positive decimal, at most 3 places.
              unitPrice:
                type: string
                description: Non-negative decimal, at most 3 places.
        taxRate:
          type: [string, 'null']
          description: Non-negative decimal, at most 4 places.
        discountAmount:
          type: [string, 'null']
          description: Non-negative decimal, at most 3 places.
    AuditEvent:
      type: object
      required: [id, action, actorPrincipalId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: Stable snake_case action name, for example `invoice.sent`.
        actorPrincipalId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties:
            type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    Dashboard:
      type: object
      required:
        - outstandingMillimes
        - overdueMillimes
        - overdueCount
        - paidThisMonthMillimes
        - paidThisMonthCount
        - issuedThisMonthCount
        - paidRateThisMonthPercent
        - customerCount
        - statusCounts
        - revenueByMonth
        - recentInvoices
      properties:
        outstandingMillimes:
          type: integer
        overdueMillimes:
          type: integer
        overdueCount:
          type: integer
        paidThisMonthMillimes:
          type: integer
          description: Money collected this month, by payment date.
        paidThisMonthCount:
          type: integer
          description: Invoices paid this month, by payment date.
        issuedThisMonthCount:
          type: integer
          description: Invoices whose issue date falls in the current month.
        paidRateThisMonthPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Whole percent of this month's issued invoices that are paid. Computed by the database
            from two counts; the client never divides rows.
        customerCount:
          type: integer
        statusCounts:
          type: object
          required: [draft, sent, overdue, paid]
          properties:
            draft:
              type: integer
            sent:
              type: integer
            overdue:
              type: integer
            paid:
              type: integer
        revenueByMonth:
          type: array
          description: Twelve entries, oldest first, grouped by month of payment.
          items:
            type: object
            required: [month, paidMillimes]
            properties:
              month:
                type: string
                description: '`YYYY-MM`.'
              paidMillimes:
                type: integer
        recentInvoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    Notification:
      type: object
      required: [id, type, data, organizationId, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [invoice_overdue, invoice_paid, invitation_accepted, member_joined]
        data:
          type: object
          additionalProperties: true
        organizationId:
          type: [string, 'null']
          format: uuid
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, unavailable]
