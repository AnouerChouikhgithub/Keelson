openapi: 3.1.0
info:
  title: Keelson API
  version: 1.0.0
  summary: Multi-tenant SaaS starter — organizations, memberships, invitations and invoicing.
  description: |
    Session-cookie API for the Keelson SPA. There is no bearer token and no API key: every
    authenticated request rides on the Symfony session cookie the browser already holds.

    **Every unsafe request (POST/PATCH/PUT/DELETE) must also send `X-CSRF-Token`**, taken from
    the `csrfToken` field of `GET /api/session` (or of a successful `POST /api/auth/login`), and a
    same-origin `Origin` header. A missing or wrong token is `403 csrf_invalid`; the SPA re-reads
    the session once and replays the request once.

    Tenant scope is a path parameter that is *re-authorized on every request* through the
    membership voters. A foreign, suspended or unknown organization, customer, invoice or membership
    answers **404**, never 403: a caller must not be able to distinguish someone else's tenant from a
    missing one. `403` is reserved for the origin/CSRF guard and for `email_not_verified`.

    Errors always use `{"error":{"code","message","fields?"}}`; `code` is stable and
    machine-readable, `fields` appears only when a specific input is at fault.

    Money is integer millimes in the dashboard and 3-decimal decimal strings on invoices
    (currency `TND` only). `overdue` is derived from `dueDate` on read; no read ever writes state.
servers:
  - url: /
    description: Same origin as the SPA (the dev Vite server proxies /api to Symfony).
tags:
  - name: Auth
  - name: Session
  - name: Profile
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Customers
  - name: Invoices
  - name: Dashboard
  - name: Notifications
  - name: Health
security:
  - cookieSession: []
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create a principal, its first organization and an Owner membership.
      description: |
        Always answers `201 verification_sent`, including for an address that already exists: in that
        case nothing is written and nothing is mailed, so the endpoint cannot be used to discover
        accounts. A verification link (24 h) is mailed to `FRONTEND_URL/verify-email?token=…`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The verification email was sent (or silently skipped).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: verification_sent
        '400':
          $ref: '#/components/responses/InvalidJson'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Start a session.
      description: |
        Wrong password and unknown address are deliberately identical. `email_not_verified` is only
        reachable after the password has been accepted, so it cannot be used to probe accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The body is exactly the `GET /api/session` payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Wrong password, unknown address or malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: Invalid credentials.
        '403':
          description: Password accepted but the address is unconfirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: email_not_verified
                  message: Your email address is not verified.
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an address from a verification link.
      description: |
        Unknown, expired (24 h) and already-used tokens are all `400 invalid_token`.
        The request carries the password the address owner chooses for the account: it replaces any
        password stored when the address was registered, so an account somebody else registered first
        cannot be signed into with their password. A missing or malformed password is `422` and leaves
        the link usable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: The address is now verified.
        '400':
          description: The token is unknown, expired or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_token
                  message: The link is invalid or has expired.
  /api/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Re-send the verification link.
      description: |
        Always `202`, with a fresh link mailed only for an address that is still pending. The new
        token retires the previous one. Throttled in its own buckets (5 per address, 100 per client
        address per minute) so flooding this endpoint cannot lock an account out of signing in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted; nothing about the account is revealed.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many resend attempts (`too_many_resend_attempts`).
          $ref: '#/components/responses/RateLimited'
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset link (valid 1 h).
      description: Always `202`; a link is mailed only when the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted; nothing about the account is revealed.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Replace a password from a reset link.
      description: |
        The address is also marked verified, because receiving the link proves mailbox control.
        Changing the hash signs every *other* session out on its next request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 10
                  maxLength: 72
      responses:
        '204':
          description: The password was replaced.
        '400':
          description: Reused or expired token (`invalid_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/auth/accept-invitation:
    post:
      tags: [Invitations]
      summary: Accept an invitation, creating the account when the address has none.
      description: |
        With no account for the invited address, `password` (10–72) is required and the new principal
        is created verified. With an existing account the caller must already be signed in as that
        address, otherwise `401 sign_in_required`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 10
                  maxLength: 72
                displayName:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: The membership was added to the existing account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResult'
        '201':
          description: An account was created and the membership added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResult'
        '400':
          description: Unknown, expired or revoked token (`invalid_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The address already has an account and the caller is not signed in as it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: sign_in_required
                  message: Sign in to accept this invitation.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the session.
      description: Requires `X-CSRF-Token`; logout is not exempt from the CSRF guard.
      responses:
        '204':
          description: The session is invalidated.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/session:
    get:
      tags: [Session]
      summary: Read the session the browser currently holds.
      description: |
        Public, and the only endpoint the shell may call before authentication. `csrfToken` is null
        while anonymous because the endpoint deliberately avoids creating a session just to mint one.
      security: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /api/me:
    patch:
      tags: [Profile]
      summary: Update the caller's display name.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: [string, 'null']
                  maxLength: 120
      responses:
        '200':
          description: The updated principal.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/me/password:
    post:
      tags: [Profile]
      summary: Change the caller's password.
      description: |
        The current session survives (its token is rewritten with the new hash); every other session
        is signed out by Symfony's hash comparison on its next request.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 10
                  maxLength: 72
      responses:
        '204':
          description: The password was changed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          description: A wrong current password is a `validation_failed` on `currentPassword`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/me/organizations:
    get:
      tags: [Organizations]
      summary: List the caller's active memberships.
      description: |
        Membership-scoped and read-only. `role` is informational for rendering; every tenant request
        is authorized separately, so a tampered value cannot grant anything.
      responses:
        '200':
          description: The caller's active memberships on active organizations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/organizations:
    post:
      tags: [Organizations]
      summary: Create an organization (the caller becomes its Owner).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: The organization, with the creator's Owner membership.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          description: The subdomain is taken (`subdomain_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/organizations/subdomain-availability:
    get:
      tags: [Organizations]
      summary: Hint whether a subdomain can be used.
      description: Always `200`; an invalid or reserved value simply answers `false`. Rate limited per principal (60/minute).
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
            maxLength: 63
      responses:
        '200':
          description: Availability hint.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    patch:
      tags: [Organizations]
      summary: Rename or readdress the tenant (Owner only).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                subdomain:
                  type: string
                  minLength: 3
                  maxLength: 63
                  pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
      responses:
        '200':
          description: The updated organization.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The subdomain is taken (`subdomain_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Organizations]
      summary: Soft-delete the tenant (Owner only, name confirmation).
      description: |
        The row keeps `status: deleted`, memberships, invoices and audit events stay, every read path
        filters the tenant out, and the subdomain stays taken.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              properties:
                confirmName:
                  type: string
                  description: Must equal the organization name exactly.
      responses:
        '200':
          description: The organization is deleted.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/organizations/{organizationId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Members]
      summary: List the roster (any active member).
      responses:
        '200':
          description: The roster of the tenant.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [Members]
      summary: Change a member's role (Owner; Admin for Member/Viewer targets only).
      description: An Admin may never grant `Admin` or `Owner`; anything outside the ceiling is 404.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The last Owner cannot be demoted (`last_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Members]
      summary: Remove a member, or leave the tenant.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The membership row is gone; the address can be invited again.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The last Owner cannot be removed (`last_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/organizations/{organizationId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Invitations]
      summary: List the tenant's invitations (Owner/Admin).
      responses:
        '200':
          description: Invitations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Invitations]
      summary: Invite an address (Owner/Admin; Admin may invite Member/Viewer only).
      description: |
        The plaintext token never leaves the mail: it is stored as a SHA-256 digest and appears only
        in `FRONTEND_URL/accept-invitation?token=…` (valid 7 days).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [Admin, Member, Viewer]
      responses:
        '201':
          description: The invitation was created and mailed.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A pending invitation exists (`conflict`) or the address is already a member (`already_member`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Invitations]
      summary: Revoke a pending invitation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The invitation is revoked.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Only a pending invitation can be revoked (`invitation_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/organizations/{organizationId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      summary: Re-send a pending invitation with a fresh token.
      description: The previous link stops working and the 7-day window restarts. Rate limited per invitation (5/minute).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The invitation was re-sent.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Only a pending invitation can be resent (`invitation_not_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The plaintext token from the invitation email.
        schema:
          type: string
    get:
      tags: [Invitations]
      summary: Public invitation preview for the accept screen.
      description: |
        Reveals nothing about account existence and nothing about the invitation id. An unknown token
        is 404; an expired or already-accepted one still resolves so the page can explain itself.
      security: []
      responses:
        '200':
          description: The invitation preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/organizations/{organizationId}/customers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Customers]
      summary: List customers (keyset paginated, case-insensitive `q`).
      description: List rows deliberately omit `billingAddress`; read one customer for the address.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of customers, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerSummary'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/InvalidCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Customers]
      summary: Create a customer.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: The created customer, including its address.
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/organizations/{organizationId}/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      summary: Read one customer, including its billing address.
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Customers]
      summary: Patch the mutable subset of a customer.
      description: Unknown or empty patches are `400`; the client sends only changed fields.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200':
          description: The updated customer.
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '400':
          description: The patch contained no mutable field, or an unsupported one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Customers]
      summary: Delete a customer (Owner/Admin; blocked while invoices reference it).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invoices reference the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: Customer is referenced by invoices.
  /api/organizations/{organizationId}/invoices:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Invoices]
      summary: List invoices (status filter, `q` search, keyset pagination).
      parameters:
        - $ref: '#/components/parameters/InvoiceStatusFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of invoices, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
