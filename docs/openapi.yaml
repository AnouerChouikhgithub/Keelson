  /api/organizations/{organizationId}/onboarding:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Dashboard]
      summary: The getting-started checklist, computed from database counts.
      description: |
        Every step is a count, never a stored flag, so the checklist survives a reload and
        agrees with what the organization actually contains. Any active member may read it;
        the step ids are stable and the client translates them.
      responses:
        '200':
