# Server block for the static SPA image.
#
# Two jobs: serve the built files with the right caching, and hand everything the
# API owns to the backend over FastCGI (the backend image runs php-fpm, which does
# not speak HTTP — see backend/docker/php-fpm.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # The headers from docs/deployment.md. The CSP allows this origin only: no
    # third-party script, style, font or connection. `style-src 'unsafe-inline'`
    # is required because the dashboard sets inline style attributes (progress
    # widths, chart bars) and attributes cannot carry a nonce.
    #
    # HSTS is deliberately absent: this server speaks HTTP and sits behind the TLS
    # terminator, which is the only place that knows the request arrived over
    # HTTPS. Adding Strict-Transport-Security here would let an HTTP response
    # instruct browsers to pin HTTPS for a year on a host that may not have it.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Compression for the text the build emits. The hashed assets are already
    # small; the index and the JSON responses are what benefit.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 8m;

    # FastCGI parameters for the Symfony front controller. SCRIPT_FILENAME points
    # at index.php for every path and PATH_INFO carries the route, which is what
    # the front controller expects.
    location ~ ^/(api|healthz|readyz) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS $https if_not_empty;
        # Forwarded only when a TLS terminator in front of this server sent them, so
        # Symfony can honour TRUSTED_PROXIES/TRUSTED_HEADERS and mark the session
        # cookie Secure (and emit HSTS) for a request that arrived over HTTPS.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 30s;
    }

    # Files under /assets carry a content hash in their name, so they can be cached
    # for a year and never revalidated. `expires` alone is used (not add_header) so
    # the security headers above still apply.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Everything else is the SPA. index.html must not be cached: it is the file
    # that points at the current asset hashes.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
